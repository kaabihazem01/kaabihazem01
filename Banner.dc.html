<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Neon banner</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 400px; box-sizing: border-box; padding: 0 72px; display: flex; align-items: center; justify-content: space-between; gap: 48px; background-color: #0A0B10; background-image: linear-gradient(#151823 1px, transparent 1px), linear-gradient(90deg, #151823 1px, transparent 1px); background-size: 40px 40px; color: #E8EAF2; font-family: 'Space Grotesk', system-ui, sans-serif; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: -160px; bottom: -220px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(45,226,200,0.22), rgba(45,226,200,0) 68%)"></div>
<div aria-hidden="true" style="position: absolute; right: -140px; top: -200px; width: 560px; height: 560px; border-radius: 50%; background: radial-gradient(circle, rgba(255,79,163,0.26), rgba(255,79,163,0) 68%)"></div>

<div style="position: relative; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; letter-spacing: 0.16em; color: {{accent}}">HELLO WORLD!</span>
<h1 style="margin: 0; font-size: 112px; line-height: 0.98; font-weight: 700; letter-spacing: -0.035em; text-shadow: 0 0 32px {{accent}}">Hazem Kaabi</h1>
<p style="margin: 0; font-size: 34px; line-height: 1.2; color: #E8EAF2">Full Stack Developer</p>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 17px; color: #9AA0B4">Tunisia  /  TypeScript  /  Next.js  /  Tailwind</span>
</div>

<div aria-hidden="true" style="position: relative; flex: none; width: 400px; box-sizing: border-box; border: 1px solid {{accent}}; border-radius: 14px; background: #0F1118; box-shadow: 0 0 40px rgba(45,226,200,0.25); overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #232634">
<span style="width: 11px; height: 11px; border-radius: 50%; background: #FF4FA3"></span>
<span style="width: 11px; height: 11px; border-radius: 50%; background: #F7DF1E"></span>
<span style="width: 11px; height: 11px; border-radius: 50%; background: #2DE2C8"></span>
</div>
<div style="padding: 20px 22px 24px; font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 30px; white-space: pre">
<div><span style="color: {{accent}}">$</span> whoami</div>
<div style="color: #E8EAF2">hazem</div>
<div><span style="color: {{accent}}">$</span> cat stack.txt</div>
<div style="color: #9B8CFF">ts  next  tailwind  shadcn</div>
<div><span style="color: {{accent}}">$</span> <span style="display: inline-block; width: 10px; height: 20px; vertical-align: -3px; background: #FF4FA3"></span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2DE2C8","options":["#2DE2C8","#7CF29A","#5BC8FF","#FFD166"]},"$preview":{"width":1280,"height":400}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2DE2C8' };
}
}
</script>
</body>
</html>
