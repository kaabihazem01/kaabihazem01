name: Update profile cards

# Refresh contribution data hourly and after profile-source changes.
# GitHub can take time to index contributions, so the hourly run is a backstop.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    # Generated outputs are committed by this workflow. Ignoring them prevents
    # a self-trigger loop while allowing ordinary profile/source pushes through.
    paths-ignore:
      - "cards/**"
      - "data/contributions.json"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: update-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonttools (provides pyftsubset)
        run: python -m pip install fonttools

      - name: Refresh contribution data
        env:
          # Add a classic PAT with read:user as PROFILE_TOKEN to include private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py "${{ github.repository_owner }}"

      - name: Render cards
        run: python scripts/build_cards.py

      - name: Commit generated contribution outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the Hero and Title 1–3 SVG files byte-for-byte unchanged.
          git add data/contributions.json cards/stats.svg cards/graph.svg README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh contribution cards"
            git push
          fi
