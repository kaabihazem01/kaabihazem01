<style>@font-face{font-family:'HzDisplay';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HzBody';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HzMono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}.d{font-family:'HzDisplay',system-ui,sans-serif;font-weight:700}.b{font-family:'HzBody',system-ui,sans-serif;font-weight:400}.m{font-family:'HzMono',ui-monospace,monospace;font-weight:400}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:1;animation:draw 1.1s ease-out both}
