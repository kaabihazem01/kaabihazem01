<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 325 150" width="325" height="150" role="img" aria-label="Styling: Tailwind + shadcn">
<title>Styling: Tailwind + shadcn</title>
<style>@font-face{font-family:'HzDisplay';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HzMono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}.d{font-family:'HzDisplay',system-ui,sans-serif;font-weight:700}.b{font-family:'HzBody',system-ui,sans-serif;font-weight:400}.m{font-family:'HzMono',ui-monospace,monospace;font-weight:400}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:1;animation:draw 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
.rise,.fade,.grow,.draw{animation:none!important}
.smil{display:none!important}
}
</style>
<defs><clipPath id="clip"><rect width="325" height="150" rx="18"/></clipPath></defs>
<rect width="325" height="150" rx="18" fill="#12141C"/>
<rect width="325" height="4" fill="#9B8CFF" clip-path="url(#clip)" class="fade" style="animation-delay:0.79s"/>
<rect x=".5" y=".5" width="324" height="149" rx="17.5" fill="none" stroke="#232634"/>
<text x="24.0" y="44.0" font-size="14" fill="#9AA0B4" letter-spacing="1.6" class="m rise" style="animation-delay:0.79s">STYLING</text>
<text x="24.0" y="98.0" font-size="31.0" fill="#E8EAF2" class="d rise" style="animation-delay:0.89s">Tailwind + shadcn</text>
<text x="24.0" y="128.0" font-size="14" fill="#9AA0B4" class="m rise" style="animation-delay:0.99s">ui.shadcn.com</text>
<path d="M283 122H307M299 114L307 122L299 130" pathLength="1" fill="none" stroke="#9B8CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="draw" style="animation-delay:1.09s"/>
<circle cx="299" cy="38" r="4" fill="#9B8CFF" class="fade" style="animation-delay:1.04s"/>
<circle class="smil" cx="299" cy="38" r="4" fill="none" stroke="#9B8CFF" opacity="0"><animate attributeName="r" values="4;13" dur="2.4s" begin="1.74s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.4s" begin="1.74s" repeatCount="indefinite"/></circle>
</svg>
