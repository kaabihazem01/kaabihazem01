<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Hazem Kaabi. Full Stack Developer from Tunisia.">
<title>Hazem Kaabi. Full Stack Developer from Tunisia.</title>
<style>@font-face{font-family:'HzDisplay';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HzBody';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HzMono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}.d{font-family:'HzDisplay',system-ui,sans-serif;font-weight:700}.b{font-family:'HzBody',system-ui,sans-serif;font-weight:400}.m{font-family:'HzMono',ui-monospace,monospace;font-weight:400}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:1;animation:draw 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
.rise,.fade,.grow,.draw{animation:none!important}
.smil{display:none!important}
}
</style>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#151823"/></pattern><radialGradient id="gp"><stop offset="0" stop-color="#FF4FA3" stop-opacity=".30"/><stop offset="1" stop-color="#FF4FA3" stop-opacity="0"/></radialGradient><radialGradient id="gb"><stop offset="0" stop-color="#2DE2C8" stop-opacity=".22"/><stop offset="1" stop-color="#2DE2C8" stop-opacity="0"/></radialGradient><filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="12"/></filter><clipPath id="clip"><rect width="1000" height="320" rx="24"/></clipPath></defs>
<rect width="1000" height="320" rx="24" fill="#0A0B10"/>
<g clip-path="url(#clip)">
<rect width="1000" height="320" fill="url(#grid)"/>
<circle cx="900" cy="20" r="340" fill="url(#gp)"/>
<circle cx="70" cy="340" r="300" fill="url(#gb)"/>
</g>
<rect x=".5" y=".5" width="999" height="319" rx="23.5" fill="none" stroke="#232634"/>
<text x="72.0" y="84.0" font-size="15" fill="#2DE2C8" letter-spacing="2.4" class="m rise" style="animation-delay:0.10s">HELLO WORLD!</text>
<g class="rise" style="animation-delay:0.25s"><text x="72" y="172" font-size="92" fill="#2DE2C8" opacity=".55" filter="url(#glow)" class="d">Hazem Kaabi</text><text x="72" y="172" font-size="92" fill="#E8EAF2" class="d">Hazem Kaabi</text></g>
<path d="M72 198H232" pathLength="1" fill="none" stroke="#2DE2C8" stroke-width="4" stroke-linecap="round" class="draw" style="animation-delay:0.70s"/>
<path d="M248 198h24" pathLength="1" fill="none" stroke="#FF4FA3" stroke-width="4" stroke-linecap="round" class="draw" style="animation-delay:0.95s"/>
<rect class="smil" x="72" y="196" width="36" height="4" rx="2" fill="#fff" opacity="0"><animate attributeName="x" values="72;196;72" dur="3.6s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="3.6s" begin="1.8s" repeatCount="indefinite"/></rect>
<text x="72.0" y="240.0" font-size="24" fill="#E8EAF2" class="b rise" style="animation-delay:0.90s">Full Stack Developer from Tunisia.</text>
<g class="rise" style="animation-delay:1.10s"><rect x="72.0" y="262" width="116.0" height="32" rx="16" fill="none" stroke="#2DE2C8"/><text x="130.0" y="283" font-size="14" fill="#2DE2C8" text-anchor="middle" class="m">TypeScript</text></g>
<g class="rise" style="animation-delay:1.22s"><rect x="200.0" y="262" width="90.8" height="32" rx="16" fill="none" stroke="#FF4FA3"/><text x="245.4" y="283" font-size="14" fill="#FF4FA3" text-anchor="middle" class="m">Next.js</text></g>
<g class="rise" style="animation-delay:1.34s"><rect x="302.8" y="262" width="174.8" height="32" rx="16" fill="none" stroke="#9B8CFF"/><text x="390.2" y="283" font-size="14" fill="#9B8CFF" text-anchor="middle" class="m">Tailwind + shadcn</text></g>
<g class="rise" style="animation-delay:0.40s"><rect x="740" y="66.0" width="188" height="188" rx="28" fill="#0A0B10" stroke="#2DE2C8" stroke-width="2"/><text x="834.0" y="190.0" font-size="84" fill="#2DE2C8" opacity=".6" filter="url(#glow)" text-anchor="middle" class="d">HK</text><text x="834.0" y="190.0" font-size="84" fill="#2DE2C8" text-anchor="middle" class="d">HK</text></g>
<rect class="smil" x="734" y="60.0" width="200" height="200" rx="34" fill="none" stroke="#2DE2C8" opacity="0"><animate attributeName="opacity" values="0;.55;0" dur="3.2s" begin="1.2s" repeatCount="indefinite"/></rect>
</svg>
