<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 185" width="495" height="185" role="img" aria-label="Repository example-repo-one">
<title>Repository example-repo-one</title>
<style>@font-face{font-family:'HzDisplay';font-weight:700;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HzBody';font-weight:400;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'HzMono';font-weight:400;src:url(data:font/woff;base64,) format('woff')}.d{font-family:'HzDisplay',system-ui,sans-serif;font-weight:700}.b{font-family:'HzBody',system-ui,sans-serif;font-weight:400}.m{font-family:'HzMono',ui-monospace,monospace;font-weight:400}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.fade{animation:fade .6s ease-out both}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.draw{stroke-dasharray:1;animation:draw 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){
.rise,.fade,.grow,.draw{animation:none!important}
.smil{display:none!important}
}
</style>
<defs><clipPath id="clip"><rect width="495" height="185" rx="18"/></clipPath></defs>
<rect width="495" height="185" rx="18" fill="#12141C"/>
<rect width="495" height="4" fill="#2DE2C8" clip-path="url(#clip)" class="fade" style="animation-delay:1.85s"/>
<rect x=".5" y=".5" width="494" height="184" rx="17.5" fill="none" stroke="#232634"/>
<text x="28.0" y="52.0" font-size="24" fill="#E8EAF2" class="d rise" style="animation-delay:1.85s">example-repo-one</text>
<text x="28.0" y="86.0" font-size="16" fill="#9AA0B4" class="b rise" style="animation-delay:1.95s">Placeholder pinned repository. The daily refresh replaces</text>
<text x="28.0" y="110.0" font-size="16" fill="#9AA0B4" class="b rise" style="animation-delay:2.03s">this with your real pinned repos.</text>
